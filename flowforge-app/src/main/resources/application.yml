# application.yml  (active in local dev — not in Docker)
spring:
  thread :
    virtual : true
  application:
    name: flowforge
  data:
    redis:
      host: localhost #${REDIS_HOST:localhost}    # 'localhost' if env var not set
      port: 6379 #${REDIS_PORT:6379}
      password: 123456789
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms
  datasource:
    url: jdbc:postgresql://ep-sparkling-frog-b4qfxiws-pooler.c-6.us-east-2.aws.neon.tech/neondb?user=neondb_owner&password=npg_HPSXz5gnYOu9&sslmode=require&channelBinding=require #jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/flowforge
    username: neondb_owner # ${POSTGRES_USER:flowforge}
    password: npg_HPSXz5gnYOu9  # ${POSTGRES_PASSWORD:flowforge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
      enabled: true
      locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

flowforge:
  workers:
    pool-size: ${WORKER_POOL_SIZE:4}
  queue:
    capacity: ${JOB_QUEUE_CAPACITY:1000}
  dlq:
    max-size: ${DLQ_MAX_SIZE:500}
  rate-limiter:
    default-capacity: ${RATE_LIMITER_DEFAULT_CAPACITY:100}
    default-rate-per-second: ${RATE_LIMITER_DEFAULT_RATE_PER_SECOND:50}
  retry:
    base-delay-ms: ${RETRY_BASE_DELAY_MS:1000}
    max-delay-ms: ${RETRY_MAX_DELAY_MS:30000}

---
# Docker profile — Redis hostname is the service name, not localhost
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      host: redis
  datasource:
    url: jdbc:postgresql://postgres:5432/flowforge